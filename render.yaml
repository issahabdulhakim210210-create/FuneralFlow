services:
  - type: web
    name: funeralflow-server
    env: node
    root: server
    plan: free
    region: oregon
    # The repo and branch will be auto-detected when you connect the GitHub repo.
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: PORT
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: static
    name: funeralflow-frontend
    env: static
    root: frontend
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build:web"
    publishCommand: "npx serve -s web-build"
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
