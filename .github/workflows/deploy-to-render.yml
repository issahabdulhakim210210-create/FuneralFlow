name: Deploy to Render

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_SERVER: ${{ secrets.RENDER_SERVICE_ID_SERVER }}
          RENDER_SERVICE_ID_FRONTEND: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo "RENDER_API_KEY secret is missing"; exit 1; fi
          if [ -z "$RENDER_SERVICE_ID_SERVER" ]; then echo "RENDER_SERVICE_ID_SERVER secret is missing"; exit 1; fi
          if [ -z "$RENDER_SERVICE_ID_FRONTEND" ]; then echo "RENDER_SERVICE_ID_FRONTEND secret is missing"; exit 1; fi

          echo "Triggering server deploy..."
          curl -X POST https://api.render.com/deploy/srv-${RENDER_SERVICE_ID_SERVER}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{}' || true

          echo "Triggering frontend deploy..."
          curl -X POST https://api.render.com/deploy/srv-${RENDER_SERVICE_ID_FRONTEND}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{}' || true
